[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phantomrecon"
version = "1.0.0"
description = "Professional bug bounty vulnerability scanner with CLI + Streamlit dashboard"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Jay" },
]
keywords = ["security", "vulnerability", "scanner", "bug-bounty", "pentesting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "httpx[http2]>=0.27.0",
    "aiohttp>=3.9.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "beautifulsoup4>=4.12.0",
    "selectolax>=0.3.20",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "pydantic>=2.6.0",
    "tldextract>=5.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
phantomrecon = "phantomrecon.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["phantomrecon"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
